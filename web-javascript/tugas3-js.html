<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tugas 3 Java Script</h1>

    <script type="text/javascript">
        let angka1 = 10;
        let angka2 = 5;

        // PENJUMLAHAN
        let hasil = angka1 + angka2;
        document.write("Hasil Penjumlahan: " + hasil + "<br>");

        // PENGURANGAN
        hasil = angka1 - angka2;
        document.write("Hasil Pengurangan: " + hasil + "<br>");

        // PERKALIAN
        hasil = angka1 * angka2;
        document.write("Hasil Perkalian: " + hasil + "<br>");
        
    </script>
    
</body>
</html>
